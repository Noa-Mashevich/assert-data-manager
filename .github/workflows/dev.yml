name: Dev Studio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: veev
  ECR_HOST: 505794203161.dkr.ecr.us-east-1.amazonaws.com

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.8'

      - name: Lint
        run: |
          pip install -r requirements.txt
          black -S app/studio --force-exclude migrations --line-length 90 --check

      - name: Test
        run: |
          python app/manage.py test studio

  build-deploy-direct:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set environment variables
        id: set-env
        run: |
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "CLUSTER=veev-dev-core" >> $GITHUB_ENV
          echo "VPC_ID=vpc-0472ea68c16693fcf" >> $GITHUB_ENV
          echo "PRIVATE_SUBNETS=subnet-05c667ecc5fccd18d,subnet-0e2e4fa350c535033" >> $GITHUB_ENV
          echo "PUBLIC_ALB_SG=sg-08d50ebb8825bb8d3" >> $GITHUB_ENV
          echo "PUBLIC_ALB_LISTENER=arn:aws:elasticloadbalancing:us-east-1:505794203161:listener/app/veev-dev-core-public/028f2294fd8a7013/9673ec14cc246b23" >> $GITHUB_ENV
          echo "PUBLIC_ALB_DNS=veev-dev-core.veev.com" >> $GITHUB_ENV
          echo "PRIVATE_ALB_SG=sg-0b74e99819f3a2605" >> $GITHUB_ENV
          echo "PRIVATE_ALB_LISTENER=arn:aws:elasticloadbalancing:us-east-1:505794203161:listener/app/veev-dev-core-private/acb6d00e4f53d341/58a096d2ffe35612" >> $GITHUB_ENV
          echo "ALB_PRIORITY=352" >> $GITHUB_ENV
          echo "STORAGE_TOPIC_ARN=arn:aws:sns:us-east-1:505794203161:veev-dev-storage-Topic-Y4FPKrAfZb6X" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Check migrations
        run: |
          docker run ${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} python manage.py makemigrations
          docker run ${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} python manage.py showmigrations

      - name: Lookup RDS SecurityGroup
        run: |
          RDS_SG=$(aws cloudformation describe-stacks --stack-name=veev-${{ env.ENVIRONMENT }}-studio-db --query="Stacks[0].Outputs[?OutputKey=='SecurityGroup'].OutputValue" --output text)
          echo "Found RDS Security Group: ${RDS_SG}"
          echo "RDS_SG=${RDS_SG}" >> $GITHUB_ENV

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: |
          sam build \
            --template-file template.yml \
            --parameter-overrides "StudioImage=${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} DeploymentEnv=${{ env.ENVIRONMENT }} Prefix=veev Settings=${{ env.ENVIRONMENT }} Cluster=${{ env.CLUSTER }} PublicALBSecurityGroupId=${{ env.PUBLIC_ALB_SG }} PublicALBHTTPSListenerArn=${{ env.PUBLIC_ALB_LISTENER }} PrivateALBSecurityGroupId=${{ env.PRIVATE_ALB_SG }} PrivateALBHTTPSListenerArn=${{ env.PRIVATE_ALB_LISTENER }} RDSSecurityGroup=${RDS_SG} VpcId=${{ env.VPC_ID }} PrivateSubnets=${{ env.PRIVATE_SUBNETS }} ALBPriority=${{ env.ALB_PRIORITY }} StorageTopicARN=${{ env.STORAGE_TOPIC_ARN }}" \
            --config-file veevsamconfig.toml \
            --config-env ${{ env.ENVIRONMENT }} \
            --parallel

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name veev-${{ env.ENVIRONMENT }}-studio \
            --parameter-overrides "StudioImage=${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} DeploymentEnv=${{ env.ENVIRONMENT }} Prefix=veev Settings=${{ env.ENVIRONMENT }} Cluster=${{ env.CLUSTER }} PublicALBSecurityGroupId=${{ env.PUBLIC_ALB_SG }} PublicALBHTTPSListenerArn=${{ env.PUBLIC_ALB_LISTENER }} PrivateALBSecurityGroupId=${{ env.PRIVATE_ALB_SG }} PrivateALBHTTPSListenerArn=${{ env.PRIVATE_ALB_LISTENER }} RDSSecurityGroup=${RDS_SG} VpcId=${{ env.VPC_ID }} PrivateSubnets=${{ env.PRIVATE_SUBNETS }} ALBPriority=${{ env.ALB_PRIORITY }} StorageTopicARN=${{ env.STORAGE_TOPIC_ARN }}" \
            --image-repository "${{ env.ECR_HOST }}/${{ env.ECR_REPOSITORY }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --tags "org=veev app=studio env=${{ env.ENVIRONMENT }} ApplicationName=\"Studio BE\" ApplicationOwner=\"Adam Konrad\" Environment=${{ env.ENVIRONMENT }}" \
            --config-file veevsamconfig.toml \
            --config-env ${{ env.ENVIRONMENT }}
